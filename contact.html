<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Css/style.css">
    <link rel="stylesheet" href="Css/responsive.css">
    <title>Contact Us</title>
</head>

<body>
    <header>
        <a href="index.html">
            <!-- <img src="" alt="company logo"> -->
            <p>MotionCare Physiotherapy</p>

        </a>
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="menu-button" aria-label="Open navigation menu">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <nav>
            <a href="index.html">Home</a>
            <a href="contact.html">Contact Us</a>
            <a href="about.html">About Us</a>
        </nav>
    </header>
    <main>
        <section>
            <h1>Ask a Question</h1>
            <p>Have a question about our physiotherapy services or your recovery? Complete the form below and our team will get back to you as soon as possible.</p>
            <form>
                <div>
                    <label for="name">Name</label>
                    <input id="name" name="name" autocomplete="name" required>
                </div>
                <div>
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <div>
                    <label for="question">Your question</label>
                    <textarea id="question" name="question" rows="6" required></textarea>
                </div>
                <button type="submit">Send Question</button>
            </form>
        </section>
    </main>
    <footer>
        <h3>Copyright © MotionCare Physiotherapy</h3>
    </footer>
</body>

</html>
